services:
  - type: web
    name: heygains
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    # Persistent disk for the SQLite database (data/hey-gains.db).
    # C7: Render's FREE plan has NO persistent disks — a disk requires a
    # paid instance (Starter, $7/mo). The disk block below is COMMENTED OUT
    # on purpose: shipping it active on the free plan fails the deploy (or
    # silently loses data). To keep data, upgrade to a paid plan, uncomment
    # the disk block AND the DATA_DIR var below. On free, accounts and trades
    # live on Render's ephemeral filesystem and are LOST on every
    # restart/redeploy. See README "Deploy — Render free data loss".
    # disk:
    #   name: heygains-data
    #   mountPath: /data
    #   sizeGB: 1
    envVars:
      - key: OWNER_NAME
        value: Lucas
      - key: NODE_ENV
        value: production
      # Point the SQLite DB at the persistent disk above. Only set this
      # when the disk is actually attached (paid plan); on free, leave it
      # unset so the DB uses the local data/ folder instead.
      # - key: DATA_DIR
      #   value: /data
      # Owner claim code (H4): whoever claims the Lucas account must enter
      # this code. Set it to a long random value in Render → Environment
      # (never commit a real one here). Leave it empty and owner claims are
      # refused outright — a fresh deploy can never be taken over by the
      # first "Lucas" registrant.
      - key: OWNER_CLAIM_CODE
        value: ''
      # Discord community invite link. Leave blank until the server is
      # ready — the in-app button then reads "Discord — coming soon".
      - key: DISCORD_INVITE_URL
        value: ''
